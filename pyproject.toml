[project]
name = "douyin-publisher"
version = "0.1.0"
description = "抖音创作者中心视频自动发布器：单次命令行任务，全异步、失败即中止"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "playwright>=1.49",
    "pydantic>=2.9",
    "psutil>=6.0",
]

[project.scripts]
douyin-publisher = "douyin_publisher.__main__:main"

[dependency-groups]
# 开发期依赖：测试与打包，不进入运行时产物
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_publisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 异步测试统一由 pytest-asyncio 接管，无需逐个标注
asyncio_mode = "auto"
# 单条测试超时封顶，杜绝「卡死伪装成运行中」
timeout = 120
markers = [
    "integration: 需要启动真实浏览器的集成测试",
]
filterwarnings = ["error::RuntimeWarning"]
